name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Run tests
        run: |
          xcodebuild test \
            -scheme SampleWorkshopApp \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -skipPackagePluginValidation \
            -skip-testing:SampleWorkshopAppUITests \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult

      - name: Download Screenshotbot recorder
        run: curl https://screenshotbot.io/recorder.sh | sh

      - name: Upload to Screenshotbot
        env:
          SCREENSHOTBOT_API_KEY: ${{ secrets.SCREENSHOTBOT_API_KEY }}
          SCREENSHOTBOT_API_SECRET: ${{ secrets.SCREENSHOTBOT_API_SECRET }}
        run: |
          ~/screenshotbot/recorder \
            --directory SampleWorkshopAppTests/__Snapshots__/ \
            --channel prefire-sample-app \
            --main-branch main \
            --recursive
